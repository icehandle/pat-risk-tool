<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>客觀三角理財邏輯分析</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f2f4f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            border-radius: 24px;
            padding: 30px 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .title {
            text-align: center;
            color: #d31145; /* AIA Red */
            font-size: 24px;
            font-weight: 800;
            margin: 0 0 6px 0;
        }

        .subtitle {
            text-align: center;
            color: #333333;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 30px;
        }

        /* 3 個直立滑桿區域 */
        .sliders-container {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            height: 220px;
            margin-bottom: 25px;
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            width: 30%;
        }

        .slider-label {
            font-size: 16px;
            font-weight: 700;
            color: #222222;
            margin-bottom: 15px;
        }

        /* 直立滑桿容器 */
        .range-wrapper {
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 140px; /* 控制滑桿長度 */
            height: 10px;
            background: #e5e5e5;
            border-radius: 5px;
            outline: none;
            transform: rotate(-90deg); /* 轉成直立 */
            cursor: pointer;
        }

        /* 滑桿圓鈕（iOS/Chrome） */
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #d31145;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(211, 17, 69, 0.3);
            border: 2px solid #ffffff;
        }

        .slider-value {
            font-size: 15px;
            font-weight: 700;
            color: #d31145;
            margin-top: 15px;
        }

        /* 下方描述結果卡片 */
        .result-card {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #edf0f2;
        }

        .result-title {
            font-size: 20px;
            font-weight: 800;
            color: #111111;
            margin-bottom: 10px;
        }

        .result-desc {
            font-size: 20px;
            color: #555555;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .result-recommend {
            background: #fff0f2;
            border-radius: 12px;
            padding: 12px 14px;
            color: #d31145;
            font-size: 18px;
            font-weight: 700;
            line-height: 1.5;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="card">
    <h1 class="title">客觀三角理財需求分析</h1>
    <div class="subtitle">ver.13 內部使用</div>

    <div class="sliders-container">
        <!-- 風險 -->
        <div class="slider-group">
            <div class="slider-label">風險</div>
            <div class="range-wrapper">
                <input type="range" id="risk" min="1" max="3" value="1" oninput="updateUI()">
            </div>
            <div class="slider-value" id="risk-val">低</div>
        </div>

        <!-- 回報 -->
        <div class="slider-group">
            <div class="slider-label">回報</div>
            <div class="range-wrapper">
                <input type="range" id="return" min="1" max="3" value="1" oninput="updateUI()">
            </div>
            <div class="slider-value" id="return-val">低</div>
        </div>

        <!-- 時間 -->
        <div class="slider-group">
            <div class="slider-label">時間</div>
            <div class="range-wrapper">
                <input type="range" id="time" min="1" max="3" value="1" oninput="updateUI()">
            </div>
            <div class="slider-value" id="time-val">中</div>
        </div>
    </div>

    <!-- 結果區塊 -->
    <div class="result-card">
        <div class="result-title" id="res-title">載入中...</div>
        <div class="result-desc" id="res-desc">...</div>
        <div class="result-recommend" id="res-rec">...</div>
    </div>
</div>

        },
        "2_3_1": {
            title: "波段衝刺型",
            desc: "追求中短期的高回報，能承受一定程度的資本波動，需注意風險管理",
            rec: "📌投資涉及風險，不存在必賺不賠📌<br><br>💡 建議方案：<br>高回報伴隨高風險"
        },
        "2_3_2": {

        },
        "2_3_3": {
            title: "長線資產倍增型",

        // --- 高風險 (3_x_x) ---

    function updateUI() {
        // 1. 取得三個滑桿的值
        const r = document.getElementById('risk').value;
        const ret = document.getElementById('return').value;
        const t = document.getElementById('time').value;

        // 2. 更新滑桿下方文字
        document.getElementById('risk-val').innerText = labels[r];
        document.getElementById('return-val').innerText = returnLabels[ret];
        document.getElementById('time-val').innerText = timeLabels[t];

        // 3. 組合出 Key (例如 "1_1_2")
        const key = `${r}_${ret}_${t}`;

        // 4. 從資料庫直接取出對應結果 (如果找不到就顯示預設)
        const result = dataMatrix[key] || {
            title: "客製化配置型",
            desc: "根據您的獨特偏好，建議進行進一步專業個案分析。",
            rec: "💡 建議方案：<br>綜合理財規劃與風險評估"
        };

        // 5. 渲染至畫面上
        document.getElementById('res-title').innerText = result.title;
        document.getElementById('res-desc').innerText = result.desc;
        document.getElementById('res-rec').innerHTML = result.rec;
    }

    // 頁面初次載入執行一次
    updateUI();
</script>

</body>
</html>
